<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
  <title id="title">AI YouTube Research Engine architecture</title>
  <desc id="desc">Three n8n workflows discover videos, analyse comments, store opportunities in PostgreSQL, and send a Slack digest.</desc>
  <defs><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071d42"/><stop offset="1" stop-color="#12366d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".15"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#f2c95f"/></marker></defs>
  <rect width="1500" height="560" rx="28" fill="#f4f7fb"/><rect width="1500" height="100" rx="28" fill="url(#navy)"/>
  <text x="55" y="44" font-family="Arial" font-size="16" font-weight="700" fill="#f2c95f" letter-spacing="2">MODULAR N8N SYSTEM</text><text x="55" y="78" font-family="Arial" font-size="28" font-weight="700" fill="#fff">AI YouTube Research Engine</text>
  <g font-family="Arial" filter="url(#s)">
    <g transform="translate(55 160)"><rect width="390" height="145" rx="18" fill="#fff"/><text x="24" y="35" fill="#b67d00" font-size="13" font-weight="700">01 · DISCOVER</text><text x="24" y="68" fill="#0b1f3a" font-size="21" font-weight="700">Channel research</text><text x="24" y="98" fill="#64748b" font-size="14">Titles · thumbnails · metrics</text><text x="24" y="122" fill="#64748b" font-size="14">Outlier score · AI opportunity analysis</text></g>
    <g transform="translate(555 160)"><rect width="390" height="145" rx="18" fill="#fff"/><text x="24" y="35" fill="#b67d00" font-size="13" font-weight="700">02 · UNDERSTAND</text><text x="24" y="68" fill="#0b1f3a" font-size="21" font-weight="700">Comment intelligence</text><text x="24" y="98" fill="#64748b" font-size="14">Questions · pain points · objections</text><text x="24" y="122" fill="#64748b" font-size="14">Language patterns · follow-up ideas</text></g>
    <g transform="translate(1055 160)"><rect width="390" height="145" rx="18" fill="#fff"/><text x="24" y="35" fill="#b67d00" font-size="13" font-weight="700">03 · ACT</text><text x="24" y="68" fill="#0b1f3a" font-size="21" font-weight="700">Opportunity digest</text><text x="24" y="98" fill="#64748b" font-size="14">Ranked weekly research pipeline</text><text x="24" y="122" fill="#64748b" font-size="14">Slack notification · audit log</text></g>
  </g>
  <g fill="none" stroke="#f2c95f" stroke-width="4" marker-end="url(#a)"><path d="M445 232h100"/><path d="M945 232h100"/></g>
  <g font-family="Arial"><rect x="180" y="385" width="1140" height="105" rx="18" fill="url(#navy)"/><text x="225" y="425" fill="#f2c95f" font-size="14" font-weight="700">SHARED SYSTEM OF RECORD</text><text x="225" y="461" fill="#fff" font-size="24" font-weight="700">PostgreSQL opportunity pipeline</text><text x="790" y="448" fill="#dbe7f8" font-size="15">YouTube Data API → OpenAI vision/text → PostgreSQL → Slack</text></g>
  <g stroke="#12366d" stroke-width="3" stroke-dasharray="7 7"><path d="M250 305v80"/><path d="M750 305v80"/><path d="M1250 305v80"/></g>
</svg>

